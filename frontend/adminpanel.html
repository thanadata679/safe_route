<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeRoute — Admin Portal | Manage Accident Prone Zones</title>
  <meta name="description" content="SafeRoute Admin Panel — Edit, delete, and inspect reported accident-prone zones on the live map dashboard." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* =============================================
       DESIGN SYSTEM (DARK GLASSMORPHISM)
    ============================================= */
    :root {
      --primary: #fb8500;
      --primary-light: #ffb703;
      --primary-dark: #e07a5f;
      --bg-dark: #0a0f1d;
      --panel-bg: rgba(16, 22, 42, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8f9fa;
      --text-muted: #adb5bd;
      --accent-blue: #00b4d8;
      --accent-red: #e63946;
      --accent-green: #2dc653;
      --font-main: 'Inter', sans-serif;
      --font-title: 'Poppins', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 10% 20%, rgba(243, 156, 18, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 180, 216, 0.05) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* =============================================
       HEADER
    ============================================= */
    header {
      background: rgba(10, 15, 29, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(251, 133, 0, 0.3);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
    }

    .brand-text h1 {
      font-family: var(--font-title);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #adb5bd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text span {
      font-size: 0.75rem;
      color: var(--primary-light);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-top: -2px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .admin-badge {
      background: rgba(251, 133, 0, 0.15);
      border: 1px solid rgba(251, 133, 0, 0.3);
      color: var(--primary-light);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .admin-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--primary-light);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px var(--primary-light);
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background: var(--accent-red);
      border: none;
      color: #fff;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.25);
    }

    .btn-danger:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* =============================================
       MAIN WRAPPER & GRID Layout
    ============================================= */
    main {
      flex: 1;
      padding: 1.5rem 2rem;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 1.5rem;
      height: calc(100vh - 70px);
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.15);
    }

    .panel-title {
      font-family: var(--font-title);
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    /* =============================================
       TABLE SIDE (LEFT)
    ============================================= */
    .table-container {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      background: rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge.low {
      background: rgba(45, 198, 83, 0.15);
      color: var(--accent-green);
    }

    .badge.medium {
      background: rgba(255, 183, 3, 0.15);
      color: var(--primary-light);
    }

    .badge.high {
      background: rgba(230, 57, 70, 0.15);
      color: var(--accent-red);
    }

    .badge.critical {
      background: rgba(230, 57, 70, 0.25);
      color: #ff4d6d;
      border: 1px solid rgba(230, 57, 70, 0.4);
    }

    .actions-cell {
      display: flex;
      gap: 0.5rem;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .btn-edit:hover {
      color: var(--accent-blue);
      border-color: rgba(0, 180, 216, 0.4);
      background: rgba(0, 180, 216, 0.1);
    }

    .btn-delete:hover {
      color: var(--accent-red);
      border-color: rgba(230, 57, 70, 0.4);
      background: rgba(230, 57, 70, 0.1);
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
    }

    .clickable-row {
      cursor: pointer;
    }

    /* =============================================
       MAP PANEL (RIGHT)
    ============================================= */
    #map {
      flex: 1;
      width: 100%;
    }

    /* Custom Leaflet overrides */
    .leaflet-popup-content-wrapper {
      background: var(--bg-dark) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 12px !important;
      backdrop-filter: blur(8px);
    }

    .leaflet-popup-tip {
      background: var(--bg-dark) !important;
      border: 1px solid var(--border-color) !important;
    }

    .zone-popup-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .zone-popup-level {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .zone-popup-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .zone-popup-meta {
      font-size: 0.75rem;
      color: var(--primary-light);
      margin-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 6px;
    }

    /* =============================================
       MODAL FORM (EDIT WINDOW)
    ============================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 8, 16, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #111728;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 550px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.show .modal {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.5rem;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
      font-size: 0.85rem;
      color: #fff;
      font-family: var(--font-main);
      transition: all 0.25s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(251, 133, 0, 0.15);
    }

    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    /* Toast styling */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1100;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #111728;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      color: var(--text-main);
      font-size: 0.85rem;
      animation: slideIn 0.3s ease;
      min-width: 300px;
    }

    .toast.success { border-left: 4px solid var(--accent-green); }
    .toast.error { border-left: 4px solid var(--accent-red); }
    .toast.warning { border-left: 4px solid var(--primary); }

    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      to { transform: translateY(-10px); opacity: 0; }
    }

    .toast.fade-out {
      animation: fadeOut 0.3s forwards;
    }
  </style>
</head>

<body>
  <!-- Toast alert box -->
  <div id="toast-container"></div>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
      </div>
      <div class="brand-text">
        <h1>SafeRoute</h1>
        <span>Admin Panel</span>
      </div>
    </div>
    <div class="nav-actions">
      <div class="admin-badge" id="admin-badge">Admin Mode</div>
      <a href="index.html" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Map Dashboard
      </a>
      <button class="btn btn-danger" onclick="logoutAdmin()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Log Out
      </button>
    </div>
  </header>

  <!-- Grid layout content -->
  <main>
    <!-- Left panel: Table list -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Reported Accident Prone Zones</div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Place Name</th>
              <th>Location details</th>
              <th>Coordinates</th>
              <th>Danger Level</th>
              <th>Speed Limit</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reported-zones-tbody">
            <tr>
              <td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem;">
                Fetching data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Right panel: Map inspection -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Hotspots Map Inspector</div>
      </div>
      <div id="map"></div>
    </div>
  </main>

  <!-- Edit Modal window -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="panel-title" style="font-size:1.15rem;font-weight:600;">Edit Accident Hotspot</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="edit-form" onsubmit="saveReportUpdate(event)">
        <input type="hidden" id="edit-id" />
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group full-width">
              <label class="form-label" for="edit-name">Place Name</label>
              <input type="text" class="form-input" id="edit-name" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-state">State</label>
              <input type="text" class="form-input" id="edit-state" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-district">District</label>
              <input type="text" class="form-input" id="edit-district" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-pincode">Pincode</label>
              <input type="text" class="form-input" id="edit-pincode" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-speed">Speed Limit (km/h)</label>
              <input type="number" class="form-input" id="edit-speed" required min="5" max="150" />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-level">Danger Level</label>
              <select class="form-input" id="edit-level" required style="background: #1d243a;">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-lat">Latitude</label>
              <input type="number" class="form-input" id="edit-lat" required step="any" />
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-lng">Longitude</label>
              <input type="number" class="form-input" id="edit-lng" required step="any" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn" style="background:var(--primary);color:#fff;">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    'use strict';

    var map;
    var markersGroup;
    var allZones = [];
    const API_URL = 'http://localhost:3000/api/accident-zone';

    /* =============================================
       SESSION VERIFICATION & LOGOUT
    ============================================= */
    (function checkAdminSession() {
      try {
        const raw = sessionStorage.getItem('apz_session');
        if (!raw) {
          showToast('Unauthorized access. Please login.', 'error');
          setTimeout(() => { window.location.href = 'login.html'; }, 1200);
          return;
        }

        const s = JSON.parse(raw);
        if (s.role !== 'admin') {
          showToast('Access denied: Admins only.', 'error');
          setTimeout(() => { window.location.href = 'index.html'; }, 1200);
          return;
        }

        document.getElementById('admin-badge').textContent = 'Admin: ' + s.name;
      } catch (e) {
        window.location.href = 'login.html';
      }
    })();

    function logoutAdmin() {
      sessionStorage.removeItem('apz_session');
      showToast('Logging out...', 'info');
      setTimeout(() => { window.location.href = 'login.html'; }, 1000);
    }

    /* =============================================
       TOAST ALERTS
    ============================================= */
    const TOAST_ICONS = {
      success: '<svg viewBox="0 0 24 24" fill="none" stroke="#2dc653" stroke-width="2.5" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      error: '<svg viewBox="0 0 24 24" fill="none" stroke="#e63946" stroke-width="2.5" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="#00b4d8" stroke-width="2.5" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    };

    function showToast(message, type = 'info') {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      t.innerHTML = (TOAST_ICONS[type] || TOAST_ICONS.info) + '<span>' + message + '</span>';
      c.appendChild(t);
      setTimeout(() => {
        t.classList.add('fade-out');
        t.addEventListener('animationend', () => t.remove(), { once: true });
      }, 4000);
    }

    /* =============================================
       MAP INITIALISATION
    ============================================= */
    function initMap() {
      map = L.map('map', { center: [20.5937, 78.9629], zoom: 5 });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19,
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
    }

    /* Helper for marker color */
    function getMarkerColor(level) {
      if (level === 'high') return '#e63946';
      if (level === 'medium') return '#ffb703';
      return '#2dc653';
    }

    function createZoneIcon(level) {
      const color = getMarkerColor(level);
      return L.divIcon({
        html: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30">
                 <path d="M12 2A10 10 0 002 12c0 7.5 10 16 12 18 2-2 12-10.5 12-18A10 10 0 0012 2z" fill="${color}" opacity="0.95"/>
                 <circle cx="12" cy="12" r="5" fill="#fff"/>
               </svg>`,
        className: '',
        iconSize: [24, 30],
        iconAnchor: [12, 30],
        popupAnchor: [0, -32]
      });
    }

    /* =============================================
       FETCH & PLOT ZONES
    ============================================= */
    async function fetchAndRenderZones() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('Failed to load accident zones');
        allZones = await res.json();
        
        renderTable();
        plotMarkers();
      } catch (err) {
        showToast('Error fetching accident hotspots: ' + err.message, 'error');
      }
    }

    function renderTable() {
      const tbody = document.getElementById('reported-zones-tbody');
      if (!tbody) return;

      if (allZones.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:2rem;">No reported zones available.</td></tr>';
        return;
      }

      tbody.innerHTML = allZones.map(z => {
        return `<tr class="clickable-row" onclick="focusOnZone('${z.id}')">
                  <td style="font-weight:600;color:#fff;">${z.name}</td>
                  <td style="color:var(--text-muted);">${z.district}, ${z.state} (${z.pincode})</td>
                  <td style="color:var(--accent-blue);font-family:monospace;font-weight:500;">${parseFloat(z.latitude).toFixed(5)}, ${parseFloat(z.longitude).toFixed(5)}</td>
                  <td><span class="badge ${z.danger_level}">${z.danger_level}</span></td>
                  <td style="font-weight:600;">${z.speed_limit} km/h</td>
                  <td onclick="event.stopPropagation()">
                    <div class="actions-cell">
                      <button class="btn-icon btn-edit" title="Edit Hotspot" onclick="openEditModal('${z.id}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                          <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z" />
                        </svg>
                      </button>
                      <button class="btn-icon btn-delete" title="Delete Hotspot" onclick="deleteZone('${z.id}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                          <polyline points="3 6 5 6 21 6" />
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                          <line x1="10" y1="11" x2="10" y2="17" />
                          <line x1="14" y1="11" x2="14" y2="17" />
                        </svg>
                      </button>
                    </div>
                  </td>
                </tr>`;
      }).join('');
    }

    function plotMarkers() {
      if (!markersGroup) return;
      markersGroup.clearLayers();

      allZones.forEach(z => {
        const marker = L.marker([z.latitude, z.longitude], { icon: createZoneIcon(z.danger_level) })
          .bindPopup(`
            <div style="min-width:180px">
              <div class="zone-popup-title">${z.name}</div>
              <div class="zone-popup-level" style="color:${getMarkerColor(z.danger_level)}">${z.danger_level} danger</div>
              <div class="zone-popup-desc">District: ${z.district}, ${z.state}</div>
              <div class="zone-popup-desc">Speed Limit: ${z.speed_limit} km/h</div>
              <div class="zone-popup-meta">Reported by: ${z.reporter || 'Guest'}</div>
            </div>
          `);
        marker.zoneId = z.id;
        markersGroup.addLayer(marker);
      });
    }

    /* Zoom and pop open map when row clicked */
    function focusOnZone(id) {
      const z = allZones.find(item => String(item.id) === String(id));
      if (!z) return;

      map.setView([z.latitude, z.longitude], 13, { animate: true });

      markersGroup.eachLayer(layer => {
        if (String(layer.zoneId) === String(id)) {
          setTimeout(() => { layer.openPopup(); }, 300);
        }
      });
    }

    /* =============================================
       DELETE HANDLER
    ============================================= */
    async function deleteZone(id) {
      if (!confirm('Are you absolutely sure you want to delete this reported accident prone zone?')) return;

      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: 'DELETE'
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || 'API delete call failed');
        }
        showToast('Accident Prone Zone deleted successfully.', 'success');
        fetchAndRenderZones();
      } catch (err) {
        showToast('Could not delete zone: ' + err.message, 'error');
      }
    }

    /* =============================================
       EDIT WINDOW (MODAL) OPERATIONS
    ============================================= */
    function openEditModal(id) {
      const z = allZones.find(item => String(item.id) === String(id));
      if (!z) return;

      document.getElementById('edit-id').value = z.id;
      document.getElementById('edit-name').value = z.name;
      document.getElementById('edit-state').value = z.state;
      document.getElementById('edit-district').value = z.district;
      document.getElementById('edit-pincode').value = z.pincode;
      document.getElementById('edit-speed').value = z.speed_limit;
      document.getElementById('edit-level').value = z.danger_level;
      document.getElementById('edit-lat').value = z.latitude;
      document.getElementById('edit-lng').value = z.longitude;

      document.getElementById('edit-modal').classList.add('show');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('show');
      document.getElementById('edit-form').reset();
    }

    async function saveReportUpdate(e) {
      e.preventDefault();

      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value.trim();
      const state = document.getElementById('edit-state').value.trim();
      const district = document.getElementById('edit-district').value.trim();
      const pincode = document.getElementById('edit-pincode').value.trim();
      const speed = document.getElementById('edit-speed').value;
      const level = document.getElementById('edit-level').value;
      const lat = document.getElementById('edit-lat').value;
      const lng = document.getElementById('edit-lng').value;

      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name,
            state,
            district,
            pincode,
            speed_limit: speed,
            danger_level: level,
            latitude: lat,
            longitude: lng
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || 'API update call failed');
        }

        showToast('Accident Prone Zone details updated successfully!', 'success');
        closeEditModal();
        fetchAndRenderZones();
      } catch (err) {
        showToast('Could not update hotspot: ' + err.message, 'error');
      }
    }

    /* =============================================
       INITIALIZATION
    ============================================= */
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      fetchAndRenderZones();
    });
  </script>
</body>

</html>
